<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">Quiz App</div>
</header>

<main class="container narrow">
    <div class="card">
        <h2>Вход</h2>

        <div th:if="${param.registered}" class="alert ok">Регистрация успешна! Войдите в систему.</div>
        <div th:if="${param.error}" class="alert error">Неверное имя пользователя или пароль</div>
        <div th:if="${param.logout}" class="alert info">Вы вышли из системы</div>

        <form th:action="@{/login}" method="post">
            <label class="field">
                <span>Имя пользователя</span>
                <input type="text" name="username" required autofocus/>
            </label>
            <label class="field">
                <span>Пароль</span>
                <input type="password" name="password" required/>
            </label>
            <button type="submit" class="btn block">Войти</button>
        </form>

        <p class="muted center" style="margin-top:16px">
            Нет аккаунта? <a th:href="@{/register}" href="/register">Зарегистрироваться</a>
        </p>
    </div>
</main>

</body>
</html>
