<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Подключение к квизу — Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">Quiz App</div>
    <div class="user"><a th:href="@{/dashboard}" href="/dashboard" style="color:#fff">В кабинет</a></div>
</header>

<main class="container narrow">
    <div class="card">
        <h2>Подключение к квизу</h2>

        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/session/join}" method="post">
            <label class="field">
                <span>Код комнаты</span>
                <input type="text" name="code" placeholder="Например: ABC123" required autofocus
                       style="text-transform:uppercase; letter-spacing:4px; font-weight:700; text-align:center; font-size:20px"/>
            </label>
            <button type="submit" class="btn green block">Подключиться</button>
        </form>
    </div>
</main>

</body>
</html>
