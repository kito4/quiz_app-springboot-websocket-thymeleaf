<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Join Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<header class="bg-blue-600 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Join Quiz</h1>
</header>

<main class="max-w-md mx-auto mt-10">

    <section class="bg-white p-6 rounded-lg shadow-md">
        <form action="/session/join" method="post" class="space-y-4">

            <div>
                <label class="block text-gray-700 font-medium mb-2">Room Code</label>
                <input name="code"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Enter quiz code"/>
            </div>

            <button type="submit"
                    class="w-full bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
                Join
            </button>

            <p th:if="${error}" th:text="${error}" class="text-red-600 mt-2"></p>
        </form>
    </section>

</main>

</body>
</html>
