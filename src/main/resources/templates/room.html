<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Quiz Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

<header class="bg-indigo-600 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Quiz Room — <span th:text="${roomCode}">ROOM</span></h1>
</header>

<main class="max-w-4xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Question block -->
    <section class="md:col-span-2 bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-xl font-semibold" id="question">Ожидание вопроса...</h2>
        <div id="imageContainer" class="my-2"></div>

        <form id="answersForm" class="space-y-2">
            <div id="answers" class="space-y-2"></div>
            <button type="button" id="submitBtn"
                    onclick="submitAnswer()"
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
                Отправить
            </button>
        </form>

        <div class="mt-2 text-gray-700">
            Осталось: <span id="timer" class="font-bold">--</span> сек
        </div>
    </section>

    <!-- Leaderboard -->
    <aside class="bg-white p-6 rounded-lg shadow-md">
        <h3 class="text-lg font-semibold mb-4">Текущий лидерборд</h3>
        <ol id="leaderboard" class="list-decimal list-inside space-y-1 text-gray-800"></ol>
    </aside>

</main>

<script>
    const roomCode = /*[[${roomCode}]]*/ 'ROOM';
    let currentQuestionId = null;
    let questionShownAt = null;
    let timeLimit = 30;

    const sock = new SockJS('/ws');
    const client = Stomp.over(sock);

    client.connect({}, function () {
        client.subscribe('/topic/session/' + roomCode + '/question', function (message) {
            const q = JSON.parse(message.body);
            currentQuestionId = q.id;
            questionShownAt = Date.now();
            timeLimit = q.timeLimitSeconds || 30;

            document.getElementById('question').innerText = q.text;

            const imgC = document.getElementById('imageContainer');
            imgC.innerHTML = q.imageUrl ? ('<img src="' + q.imageUrl + '" alt="qimg" class="max-w-full rounded"/>') : '';

            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = '';
            if (q.type === 'SINGLE') {
                q.answers.forEach(a => {
                    answersDiv.innerHTML += `<div class="flex items-center"><label><input type="radio" name="answer" value="${a.id}" class="mr-2"/> ${a.text}</label></div>`;
                });
            } else {
                q.answers.forEach(a => {
                    answersDiv.innerHTML += `<div class="flex items-center"><label><input type="checkbox" name="answer" value="${a.id}" class="mr-2"/> ${a.text}</label></div>`;
                });
            }

            startTimer(timeLimit);
        });

        client.subscribe('/topic/session/' + roomCode + '/leaderboard', function (message) {
            const lb = JSON.parse(message.body);
            renderLeaderboard(lb);
        });
    });

    function startTimer(seconds) {
        let remaining = seconds;
        document.getElementById('timer').innerText = remaining;
        const iv = setInterval(() => {
            remaining--;
            document.getElementById('timer').innerText = remaining;
            if (remaining <= 0) {
                clearInterval(iv);
            }
        }, 1000);
    }

    async function submitAnswer() {
        if (!currentQuestionId) return;
        const checked = Array.from(document.querySelectorAll('#answers input:checked')).map(i => parseInt(i.value));
        const payload = {
            roomCode: roomCode,
            questionId: currentQuestionId,
            answerIds: checked,
            answeredAt: Date.now()
        };

        const res = await fetch('/api/session/submit', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        alert('Получено очков: ' + data.points);
    }

    function renderLeaderboard(list) {
        const ol = document.getElementById('leaderboard');
        ol.innerHTML = '';
        list.forEach(p => {
            const li = document.createElement('li');
            li.innerText = (p.userId ? ('User ' + p.userId) : 'User') + ' — ' + (p.score || 0);
            ol.appendChild(li);
        });
    }
</script>

</body>
</html>
