
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Room</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h1>Quiz Room</h1>
<div>
    <div id="questionBlock">
        <h2 id="question">Ожидание вопроса...</h2>
        <div id="imageContainer"></div>
        <form id="answersForm">
            <div id="answers"></div>
            <button type="button" id="submitBtn" onclick="submitAnswer()">Отправить</button>
        </form>
        <div>Осталось: <span id="timer">--</span> сек</div>
    </div>

    <h3>Текущий лидерборд</h3>
    <ol id="leaderboard"></ol>
</div>

<script>
    const roomCode = /*[[${roomCode}]]*/ 'ROOM';
    let currentQuestionId = null;
    let questionShownAt = null;
    let timeLimit = 30;

    const sock = new SockJS('/ws');
    const client = Stomp.over(sock);
    client.connect({}, function () {
        client.subscribe('/topic/session/' + roomCode + '/question', function (message) {
            const q = JSON.parse(message.body);
            currentQuestionId = q.id;
            questionShownAt = Date.now();
            timeLimit = q.timeLimitSeconds || 30;
            document.getElementById('question').innerText = q.text;
            const imgC = document.getElementById('imageContainer');
            imgC.innerHTML = q.imageUrl ? ('<img src="' + q.imageUrl + '" alt="qimg" style="max-width:300px;"/>') : '';
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = '';
            if (q.type === 'SINGLE') {
                q.answers.forEach(a => {
                    answersDiv.innerHTML += `<div><label><input type="radio" name="answer" value="${a.id}"/> ${a.text}</label></div>`;
                });
            } else {
                q.answers.forEach(a => {
                    answersDiv.innerHTML += `<div><label><input type="checkbox" name="answer" value="${a.id}"/> ${a.text}</label></div>`;
                });
            }

            startTimer(timeLimit);
        });

        client.subscribe('/topic/session/' + roomCode + '/leaderboard', function (message) {
            const lb = JSON.parse(message.body);
            renderLeaderboard(lb);
        });
    });

    function startTimer(seconds) {
        let remaining = seconds;
        document.getElementById('timer').innerText = remaining;
        const iv = setInterval(() => {
            remaining--;
            document.getElementById('timer').innerText = remaining;
            if (remaining <= 0) {
                clearInterval(iv);
                // auto submit empty if needed
            }
        }, 1000);
    }

    async function submitAnswer() {
        if (!currentQuestionId) return;
        const checked = Array.from(document.querySelectorAll('#answers input:checked')).map(i => parseInt(i.value));
        const payload = {
            roomCode: roomCode,
            questionId: currentQuestionId,
            answerIds: checked,
            answeredAt: Date.now()
        };

        const res = await fetch('/api/session/submit', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        // можно показать начисленные очки
        alert('Получено очков: ' + data.points);

        // После отправки запросим обновлённый лидерборд (через отдельный endpoint или websocket push)
        // В простом варианте — делаем fetch на endpoint, но в нашей системе лидерборд пушится через WS при завершении или по расписанию.
    }

    function renderLeaderboard(list) {
        const ol = document.getElementById('leaderboard');
        ol.innerHTML = '';
        list.forEach(p => {
            const li = document.createElement('li');
            li.innerText = (p.userId ? ('User ' + p.userId) : 'User') + ' — ' + (p.score || 0);
            ol.appendChild(li);
        });
    }
</script>
</body>
</html>
