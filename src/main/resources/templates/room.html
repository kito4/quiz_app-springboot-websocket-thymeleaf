<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Комната — Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <script th:src="@{/js/websocket.js}" src="/js/websocket.js"></script>
</head>
<body>

<header class="topbar">
    <div class="logo">Quiz App</div>
    <div class="user">
        <span th:text="'Комната ' + ${roomCode}">Комната</span>
        <a th:href="@{/dashboard}" href="/dashboard" style="color:#fff">Выйти</a>
    </div>
</header>

<main class="container">
    <div class="grid-2">
        <div class="card" id="questionCard">
            <div class="row">
                <span class="badge status-CREATED" id="questionCounter">Ожидание</span>
                <span class="spacer"></span>
                <span class="timer-pill" id="timerPill" style="display:none"><span id="timer">--</span></span>
            </div>

            <h2 id="questionText" style="margin:16px 0 6px">Ожидание вопроса…</h2>
            <p class="muted" id="quizTitle" th:text="${quizTitle}">Квиз</p>

            <div id="imageContainer"></div>

            <div id="answers" style="display:grid; gap:10px; margin-top:14px"></div>

            <div class="row" style="margin-top:16px">
                <button type="button" id="submitBtn" class="btn green" onclick="submitAnswer()" disabled>
                    Отправить ответ
                </button>
                <span id="feedback" class="muted"></span>
            </div>
        </div>

        <div class="card">
            <h3>Лидерборд</h3>
            <div id="leaderboard"><p class="muted">Пока никто не ответил.</p></div>
        </div>
    </div>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const roomCode = /*[[${roomCode}]]*/ 'ROOM';

    let currentQuestionId = null;
    let answered = false;
    let timerInterval = null;

    QuizSocket.connect(function (client) {
        client.subscribe('/topic/session/' + roomCode + '/question', function (message) {
            showQuestion(JSON.parse(message.body));
        });
        client.subscribe('/topic/session/' + roomCode + '/leaderboard', function (message) {
            renderLeaderboard(JSON.parse(message.body));
        });
        client.subscribe('/topic/session/' + roomCode + '/status', function (message) {
            const st = JSON.parse(message.body);
            if (st.status === 'FINISHED') {
                showFinished();
            }
        });
    });

    fetch('/api/session/' + encodeURIComponent(roomCode) + '/state')
        .then(r => r.json())
        .then(state => {
            if (state.status === 'FINISHED') {
                showFinished();
                renderLeaderboard(state.leaderboard || []);
            } else if (state.question) {
                showQuestion(state.question);
            }
            if (state.leaderboard) renderLeaderboard(state.leaderboard);
        })
        .catch(() => {});

    function showQuestion(q) {
        currentQuestionId = q.id;
        answered = false;

        document.getElementById('questionCounter').innerText = 'Вопрос ' + q.index + ' / ' + q.total;
        document.getElementById('questionText').innerText = q.text;
        document.getElementById('feedback').innerText = '';
        document.getElementById('submitBtn').disabled = false;

        const imgC = document.getElementById('imageContainer');
        imgC.innerHTML = q.imageUrl
            ? '<img class="question-image" src="' + q.imageUrl + '" alt="изображение вопроса"/>'
            : '';

        const answersDiv = document.getElementById('answers');
        answersDiv.innerHTML = '';
        const inputType = q.type === 'MULTIPLE' ? 'checkbox' : 'radio';
        (q.answers || []).forEach(a => {
            const label = document.createElement('label');
            label.className = 'answer-option';
            const input = document.createElement('input');
            input.type = inputType;
            input.name = 'answer';
            input.value = a.id;
            input.addEventListener('change', () => {
                if (inputType === 'radio') {
                    answersDiv.querySelectorAll('.answer-option')
                        .forEach(el => el.classList.remove('selected'));
                }
                label.classList.toggle('selected', input.checked);
            });
            const span = document.createElement('span');
            span.textContent = a.text;
            label.appendChild(input);
            label.appendChild(span);
            answersDiv.appendChild(label);
        });

        startTimer(q.timeLimitSeconds || 30);
    }

    function startTimer(seconds) {
        if (timerInterval) clearInterval(timerInterval);
        let remaining = seconds;
        const pill = document.getElementById('timerPill');
        const el = document.getElementById('timer');
        pill.style.display = 'inline-flex';
        el.innerText = remaining;
        pill.classList.remove('low');
        timerInterval = setInterval(() => {
            remaining--;
            el.innerText = Math.max(remaining, 0);
            if (remaining <= 5) pill.classList.add('low');
            if (remaining <= 0) {
                clearInterval(timerInterval);
                lockQuestion('Время вышло');
            }
        }, 1000);
    }

    function lockQuestion(message) {
        answered = true;
        document.getElementById('submitBtn').disabled = true;
        document.querySelectorAll('#answers input').forEach(i => i.disabled = true);
        if (message) document.getElementById('feedback').innerText = message;
    }

    async function submitAnswer() {
        if (!currentQuestionId || answered) return;
        const checked = Array.from(document.querySelectorAll('#answers input:checked'))
            .map(i => parseInt(i.value));
        if (checked.length === 0) {
            document.getElementById('feedback').innerText = 'Выберите хотя бы один вариант';
            return;
        }

        document.getElementById('submitBtn').disabled = true;
        try {
            const res = await fetch('/api/session/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    roomCode: roomCode,
                    questionId: currentQuestionId,
                    answerIds: checked
                })
            });
            const data = await res.json();
            if (!data.accepted) {
                document.getElementById('feedback').innerText = data.reason || 'Ответ не принят';
                document.getElementById('submitBtn').disabled = false;
                return;
            }
            answered = true;
            document.getElementById('feedback').innerText = data.correct
                ? 'Верно! +' + data.points + ' очков (всего: ' + data.totalScore + ')'
                : 'Неверно. Очков: 0 (всего: ' + data.totalScore + ')';
            document.getElementById('feedback').style.color = data.correct ? '#059669' : '#dc2626';
            document.getElementById('feedback').style.fontWeight = '700';
        } catch (e) {
            document.getElementById('feedback').innerText = 'Ошибка сети, попробуйте ещё раз';
            document.getElementById('submitBtn').disabled = false;
        }
    }

    function renderLeaderboard(list) {
        const div = document.getElementById('leaderboard');
        if (!list || list.length === 0) {
            div.innerHTML = '<p class="muted">Пока никто не ответил.</p>';
            return;
        }
        div.innerHTML = '';
        list.forEach(p => {
            const item = document.createElement('div');
            item.className = 'leaderboard-item' + (p.rank === 1 ? ' top1' : '');
            item.innerHTML =
                '<span class="rank">' + p.rank + '</span>' +
                '<span class="name"></span>' +
                '<span class="score">' + p.score + '</span>';
            item.querySelector('.name').textContent = p.username;
            div.appendChild(item);
        });
    }

    function showFinished() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('timerPill').style.display = 'none';
        document.getElementById('questionCounter').innerText = 'Квиз завершён';
        document.getElementById('questionText').innerText = 'Квиз завершён! Смотрите лидерборд справа.';
        document.getElementById('answers').innerHTML = '';
        document.getElementById('imageContainer').innerHTML = '';
        document.getElementById('submitBtn').style.display = 'none';
    }
    /*]]>*/
</script>

</body>
</html>
