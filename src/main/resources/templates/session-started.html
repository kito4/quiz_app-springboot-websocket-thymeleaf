<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Quiz Started</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<header class="bg-green-600 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Quiz Started</h1>
</header>

<main class="max-w-md mx-auto mt-10">

    <section class="bg-white p-6 rounded-lg shadow-md text-center space-y-4">
        <h2 class="text-xl font-semibold">Room Code</h2>
        <h1 class="text-3xl font-bold text-green-700" th:text="${roomCode}">XXXX</h1>
        <p class="text-gray-700">Participants can join using this code.</p>
        <a href="/dashboard"
           class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
            Back to Dashboard
        </a>
    </section>

</main>

</body>
</html>
