<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<header class="bg-blue-600 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Register</h1>
</header>

<main class="max-w-md mx-auto mt-10">

    <section class="bg-white p-6 rounded-lg shadow-md space-y-4">
        <form action="/register" method="post" class="space-y-4">

            <div>
                <label class="block text-gray-700 font-medium mb-1">Username</label>
                <input name="username" placeholder="Enter username"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Password</label>
                <input type="password" name="password" placeholder="Enter password"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Role</label>
                <select name="role"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="ROLE_PARTICIPANT">Participant</option>
                    <option value="ROLE_ORGANIZER">Organizer</option>
                </select>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                Create account
            </button>

            <p th:if="${error}" th:text="${error}" class="text-red-600 mt-2"></p>

            <p class="text-gray-600 mt-2">
                <a href="/login" class="text-blue-600 hover:underline">Back to login</a>
            </p>

        </form>
    </section>

</main>

</body>
</html>
