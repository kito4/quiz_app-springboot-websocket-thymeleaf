<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">Quiz App</div>
</header>

<main class="container narrow">
    <div class="card">
        <h2>Регистрация</h2>

        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <label class="field">
                <span>Имя пользователя</span>
                <input type="text" name="username" required autofocus/>
            </label>
            <label class="field">
                <span>Пароль (минимум 4 символа)</span>
                <input type="password" name="password" required minlength="4"/>
            </label>
            <label class="field">
                <span>Роль</span>
                <select name="role">
                    <option value="ROLE_PARTICIPANT">Участник</option>
                    <option value="ROLE_ORGANIZER">Организатор</option>
                </select>
            </label>
            <button type="submit" class="btn block">Создать аккаунт</button>
        </form>

        <p class="muted center" style="margin-top:16px">
            Уже есть аккаунт? <a th:href="@{/login}" href="/login">Войти</a>
        </p>
    </div>
</main>

</body>
</html>
