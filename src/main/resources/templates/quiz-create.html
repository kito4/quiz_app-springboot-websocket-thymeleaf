<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создание квиза — Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">Quiz App</div>
    <div class="user"><a th:href="@{/dashboard}" href="/dashboard" style="color:#fff">В кабинет</a></div>
</header>

<main class="container narrow">
    <div class="card">
        <h2>Новый квиз</h2>

        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/quiz}" method="post">
            <label class="field">
                <span>Название квиза</span>
                <input type="text" name="title" placeholder="Например: Викторина по истории" required autofocus/>
            </label>
            <label class="field">
                <span>Категория</span>
                <input type="text" name="category" placeholder="История, IT, Кино..."/>
            </label>
            <label class="field">
                <span>Время на вопрос (секунд)</span>
                <input type="number" name="timeLimitSeconds" value="30" min="5" max="300"/>
            </label>
            <button type="submit" class="btn block">Создать и перейти к вопросам</button>
        </form>
    </div>
</main>

</body>
</html>
