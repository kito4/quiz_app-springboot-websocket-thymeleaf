<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Create Quiz</title>
</head>
<body>

<h1>Create Quiz</h1>

<form action="/quiz" method="post">

    <div>
        <label>Title</label>
        <input name="title"/>
    </div>

    <div>
        <label>Category</label>
        <input name="category"/>
    </div>

    <button type="submit">Create</button>

</form>

</body>
</html>
