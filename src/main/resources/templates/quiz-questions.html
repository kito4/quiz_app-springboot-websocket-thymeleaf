<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вопросы квиза — Quiz App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">Quiz App</div>
    <div class="user"><a th:href="@{/dashboard}" href="/dashboard" style="color:#fff">В кабинет</a></div>
</header>

<main class="container">
    <div class="card">
        <div class="row">
            <h2 class="mt0" th:text="'Квиз: ' + ${quiz.title}">Квиз</h2>
            <span class="spacer"></span>
            <span class="muted" th:text="'Категория: ' + ${quiz.category} + ' · ' + ${quiz.timeLimitSeconds} + ' сек на вопрос'"></span>
        </div>
    </div>

    <div class="grid-2">
        <div class="card">
            <h3>Добавить вопрос</h3>
            <form th:action="@{'/quiz/' + ${quiz.id} + '/question'}" method="post" enctype="multipart/form-data">
                <label class="field">
                    <span>Текст вопроса</span>
                    <textarea name="text" rows="2" placeholder="Введите вопрос" required></textarea>
                </label>

                <label class="field">
                    <span>Тип вопроса</span>
                    <select name="type" id="typeSelect" onchange="toggleCorrectMode()">
                        <option value="SINGLE">Одиночный выбор (один правильный)</option>
                        <option value="MULTIPLE">Множественный выбор (несколько правильных)</option>
                    </select>
                </label>

                <label class="field">
                    <span>Изображение (файл)</span>
                    <input type="file" name="imageFile" accept="image/*"/>
                </label>
                <label class="field">
                    <span>…или ссылка на изображение</span>
                    <input type="url" name="imageUrl" placeholder="https://..."/>
                </label>

                <h3 style="margin-top:20px">Варианты ответа</h3>
                <p class="muted" id="correctHint">Отметьте один правильный ответ.</p>

                <div id="answersBlock">
                    <label class="answer-option" style="margin-bottom:8px" th:each="i : ${#numbers.sequence(0, 3)}">
                        <input type="checkbox" name="correctIndexes" th:value="${i}"/>
                        <input type="text" name="answers" th:placeholder="'Вариант ' + (${i} + 1)" style="border:none;background:transparent;padding:0"/>
                    </label>
                </div>

                <button type="submit" class="btn block" style="margin-top:14px">Добавить вопрос</button>
            </form>
        </div>

        <div class="card">
            <h3 th:text="'Вопросы (' + ${#lists.size(questions)} + ')'">Вопросы</h3>
            <div th:if="${#lists.isEmpty(questions)}" class="muted">Пока нет вопросов.</div>
            <div th:each="q, st : ${questions}" style="border-bottom:1px solid var(--border); padding:10px 0">
                <div class="row">
                    <strong th:text="(${st.index} + 1) + '. '">1.</strong>
                    <span th:text="${q.text}">Вопрос</span>
                </div>
                <div class="muted" style="margin:4px 0 4px 22px">
                    <span th:text="${q.type == 'MULTIPLE'} ? 'множественный выбор' : 'одиночный выбор'">тип</span>
                    <span th:if="${q.imageUrl}"> · <a th:href="${q.imageUrl}" target="_blank">изображение</a></span>
                </div>
                <form th:action="@{'/quiz/' + ${quiz.id} + '/question/' + ${q.id} + '/delete'}"
                      method="post" style="margin:0 0 0 22px"
                      onsubmit="return confirm('Удалить вопрос?')">
                    <button type="submit" class="btn small red">Удалить</button>
                </form>
            </div>

            <form th:action="@{'/session/start/' + ${quiz.id}}" method="post" style="margin-top:18px">
                <button type="submit" class="btn green block" th:disabled="${#lists.isEmpty(questions)}">
                    Запустить квиз
                </button>
            </form>
        </div>
    </div>
</main>

<script>
    function toggleCorrectMode() {
        const type = document.getElementById('typeSelect').value;
        document.getElementById('correctHint').innerText =
            type === 'MULTIPLE'
                ? 'Отметьте все правильные ответы.'
                : 'Отметьте один правильный ответ.';
    }
</script>

</body>
</html>
